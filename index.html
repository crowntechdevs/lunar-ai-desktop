<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrownOS™ — Quiet Luxury Operating System</title>
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #141110;
      --accent-bronze: #C88A58;
      --accent-glow: rgba(200, 138, 88, 0.25);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(200, 138, 88, 0.18);
      --glass-card: rgba(20, 17, 16, 0.75);
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #221C19 0%, var(--bg-base) 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
    }

    /* Fondo fluido orgánico */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--glass-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 3px;
      color: var(--accent-bronze);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .os-badge {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 2px;
      border: 1px solid var(--accent-bronze);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(200, 138, 88, 0.1);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }

    /* Omnipresent Search Bar (CrownOS Local Search) */
    .search-container {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 480px;
      z-index: 10;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      width: 18px;
      height: 18px;
      stroke: var(--accent-bronze);
    }

    .search-bar {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--glass-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .search-bar:focus {
      border-color: var(--accent-bronze);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Dock Lateral Flotante */
    .dock {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 12px;
      background: var(--glass-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dock-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      transition: stroke 0.3s ease;
    }

    .dock-icon:hover {
      border-color: var(--accent-bronze);
      background: rgba(200, 138, 88, 0.1);
      transform: scale(1.1);
    }

    .dock-icon:hover svg {
      stroke: var(--accent-bronze);
    }

    /* Panel de Ajustes Modal (Settings Window) */
    .settings-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 520px;
      background: var(--glass-card);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 24px;
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
    }

    .settings-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-bronze);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .setting-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .setting-card:hover {
      border-color: var(--accent-bronze);
      background: rgba(200, 138, 88, 0.08);
    }

    /* LUNAR™ Pod Widget (Tamaño Compacto) */
    .lunar-pod-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      width: 210px;
      padding: 16px;
      background: var(--glass-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .lunar-pod-frame {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2A2421, #141110);
      border: 1.5px solid var(--accent-bronze);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .lunar-avatar-icon {
      width: 44px;
      height: 44px;
      stroke: var(--accent-bronze);
    }

    .lunar-info {
      margin-top: 10px;
      text-align: center;
    }

    .lunar-name {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-bronze);
    }

    .lunar-status {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand-container">
      <span class="brand-title">C R O W N</span>
      <span class="os-badge">OS™</span>
    </div>
    <div class="status-group">
      <span id="clock">00:00</span>
      <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>
  </header>

  <!-- Omnipresent Search Bar -->
  <div class="search-container">
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" class="search-bar" placeholder="Search CrownOS™ or local files...">
    </div>
  </div>

  <!-- Floating Dock -->
  <nav class="dock">
    <div class="dock-icon" title="Crown Hub">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/>
        <rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
      </svg>
    </div>
    <div class="dock-icon" title="Archivos">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L8.6 3.3A2 2 0 0 0 6.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
      </svg>
    </div>
    <div class="dock-icon" title="OnaDraft Omni™">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </div>
    <div class="dock-icon" id="openSettings" title="Ajustes de Sistema">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
  </nav>

  <!-- Panel de Ajustes Modal -->
  <div class="settings-modal" id="settingsModal">
    <div class="settings-header">
      <span class="settings-title">Ajustes de Sistema — CrownOS™</span>
      <button class="close-btn" id="closeSettings">✕</button>
    </div>
    <div class="settings-grid">
      <div class="setting-card">🎨 Visual & Temas</div>
      <div class="setting-card">🖥️ Pantalla & Escala</div>
      <div class="setting-card">⌨️ Teclado & Mouse</div>
      <div class="setting-card">🔊 Audio & Sonido</div>
      <div class="setting-card">🛡️ Privacidad & CrownAI™</div>
      <div class="setting-card">🔋 Batería & Rendimiento</div>
    </div>
  </div>

  <!-- LUNAR™ Companion Pod -->
  <div class="lunar-pod-container">
    <div class="lunar-pod-frame">
      <svg class="lunar-avatar-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="5"/>
        <path d="M20 21a8 8 0 0 0-16 0"/>
      </svg>
    </div>
    <div class="lunar-info">
      <div class="lunar-name">LUNAR™</div>
      <div class="lunar-status">Coffee Break • Active</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    const openSettings = document.getElementById('openSettings');
    const closeSettings = document.getElementById('closeSettings');
    const settingsModal = document.getElementById('settingsModal');

    openSettings.addEventListener('click', () => {
      settingsModal.style.display = 'block';
    });

    closeSettings.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });
  </script>
</body>
</html>
