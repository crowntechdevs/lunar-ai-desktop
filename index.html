<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrownOS™ — Quiet Luxury Operating System</title>
  
  <!-- Google Fonts: Syne & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #141110;
      --accent-bronze: #C88A58;
      --accent-glow: rgba(200, 138, 88, 0.25);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(200, 138, 88, 0.18);
      --glass-card: rgba(20, 17, 16, 0.75);
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #221C19 0%, var(--bg-base) 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
    }

    /* Fondo fluido orgánico */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--glass-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 3px;
      color: var(--accent-bronze);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .os-badge {
      font-family: 'Syne', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 2px;
      border: 1px solid var(--accent-bronze);
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(200, 138, 88, 0.1);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-icon {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }

    /* Omnipresent Search Bar (CrownOS Local Search) */
    .search-container {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 480px;
      z-index: 10;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      width: 18px;
      height: 18px;
      stroke: var(--accent-bronze);
    }

    .search-bar {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: var(--glass-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .search-bar:focus {
      border-color: var(--accent-bronze);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Dock Lateral Flotante */
    .dock {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 12px;
      background: var(--glass-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dock-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      transition: stroke 0.3s ease;
    }

    .dock-icon:hover {
      border-color: var(--accent-bronze);
      background: rgba(200, 138, 88, 0.1);
      transform: scale(1.1);
    }

    .dock-icon:hover svg {
      stroke: var(--accent-bronze);
    }

    /* Panel de Ajustes Modal (Settings Window) */
