<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrownOS™ — Powered by CrownAI™</title>
  <style>
    :root {
      --bg-base: #141110;
      --accent-bronze: #C88A58;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(200, 138, 88, 0.2);
      --text-main: #F4F4F5;
      --text-muted: #A1A1AA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #1F1A18 0%, var(--bg-base) 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent-bronze);
    }

    /* Search Bar */
    .search-container {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
    }

    .search-bar {
      width: 100%;
      padding: 14px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      color: var(--text-main);
      outline: none;
      text-align: center;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Floating Dock */
    .dock {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
    }

    .dock-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dock-icon:hover {
      border-color: var(--accent-bronze);
      transform: scale(1.08);
    }

    /* LUNAR™ Companion Pod (Escala Compacta) */
    .lunar-pod-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 220px;
      height: 180px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .lunar-avatar-placeholder {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #E2E8F0, #A1A1AA);
      border: 2px solid var(--accent-bronze);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 20px rgba(200, 138, 88, 0.3);
    }

    .lunar-status {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">CrownOS™</div>
    <div class="status" id="clock">00:00 AM</div>
  </div>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Buscar o consultar a CrownAI™...">
  </div>

  <!-- Dock Lateral -->
  <div class="dock">
    <div class="dock-icon">👑</div>
    <div class="dock-icon">📁</div>
    <div class="dock-icon">🎨</div>
    <div class="dock-icon">⚙️</div>
  </div>

  <!-- Pod de LUNAR™ (Tamaño sutil/compacto) -->
  <div class="lunar-pod-container">
    <div class="lunar-avatar-placeholder" id="lunarAvatar">☕</div>
    <div class="lunar-status">LUNAR™ — Coffee Break ☕</div>
  </div>

  <script>
    // Reloj dinámico
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
